# Pull requests are squash-merged, so the title becomes the commit on main. It has to be a
# Conventional Commit: release-please reads it to pick the next version and write the changelog.
name: PR title

# pull_request, not pull_request_target: GitHub does not start pull_request_target for a pull
# request that release-please opens with the workflow token, so the required check never came and
# the release pull request stayed blocked. The check only reads the title, which the read-only
# token of pull_request (also for forks) is enough for.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
