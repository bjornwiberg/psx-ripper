# Every pull request: the UI tests on the host and the PS3 build. main only takes pull requests
# that passed them against the latest main, so a push to main is not tested again. The release
# pull request from release-please only changes the version and the changelog: its jobs are
# skipped (a skipped job counts as passed for the branch protection), and the release build
# itself runs in release.yml.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI tests (host)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Draw the scenarios and check them
        run: make -C tests/host
      - name: Keep the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-frames
          path: tests/host/out/*.png
          retention-days: 14

  build:
    name: PS3 package
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Toolchain image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          tags: ps3dev-psl1ght:ci
          load: true
          cache-from: type=gha,scope=ps3dev
          cache-to: type=gha,scope=ps3dev,mode=max
      - name: Build psxripper.pkg
        run: docker run --rm -v "$PWD":/src -w /src ps3dev-psl1ght:ci make pkg
      - name: Name it after the version and commit
        run: |
          v=$(cat version.txt)
          cp psxripper.pkg "psxripper-${v}+${GITHUB_SHA::7}.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: psxripper-pkg
          path: psxripper-*.pkg
          retention-days: 30
